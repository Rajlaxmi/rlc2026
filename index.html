<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RLC 2026 Conference Tracker</title>
  <meta name="description" content="RLC 2026 conference and workshop schedule tracker.">
  <style>
    :root{--ink:#17231e;--paper:#f5f3ec;--line:#d9ddd8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 88% 4%,#dceae0,transparent 28%),var(--paper);color:var(--ink);font:14px Arial,sans-serif}main{padding:42px;min-height:100vh}.eyebrow{font-size:12px;letter-spacing:.15em;text-transform:uppercase;font-weight:800;color:#52605a}.eyebrow:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff5a4f;margin-right:9px}h1{font-size:clamp(40px,6vw,74px);line-height:.95;letter-spacing:-.055em;margin:16px 0 10px}header p{color:#68726d;font-size:16px}.tabs{display:flex;gap:8px;overflow:auto;margin:26px 0 16px}.tabs a{min-width:125px;padding:11px 14px;border:1px solid #cdd4cf;border-radius:12px;background:#fff;color:inherit;text-decoration:none}.tabs b,.tabs span{display:block}.tabs span{margin-top:3px;color:#78827d;font-size:10px;text-transform:uppercase;letter-spacing:.08em}.tabs a.active{background:#22352d;color:#fff;border-color:#22352d}.notice{padding:12px 16px;background:#22352d;color:#d8e1dc;border-radius:12px;margin-bottom:12px}.wrap{overflow:auto;max-height:calc(100vh - 300px);background:#fff;border:1px solid #ccd2ce;border-radius:16px}table{border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:1100px;width:100%}th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:top}thead th{position:sticky;top:0;z-index:3;background:#f7f7f2;padding:15px;text-align:left;border-top:5px solid var(--accent,#243b32);height:82px}.room{display:block;margin-top:12px;font-size:10px;color:#66716b;text-transform:uppercase;letter-spacing:.08em}.time{position:sticky;left:0;z-index:4;width:80px;background:#f7f7f2;text-align:center;padding:16px 8px}td{height:74px;padding:7px}.card{display:block;border-left:3px solid #263b32;background:#f4f7f5;border-radius:7px;padding:9px;color:inherit;text-decoration:none;margin-bottom:5px}.card:hover{box-shadow:0 5px 14px #263b3217;transform:translateY(-1px)}.card b{display:block;font-size:12px}.source-arrow{float:right;color:#52605a;text-decoration:none}.site-line{display:block!important;margin:2px 0 5px}.speaker-site{font-size:9px;color:#376d58;text-decoration:underline;text-underline-offset:2px}.break{background:#f4efe3;border-color:#d1a64d}.poster{background:#edf2f8;border-color:#6c87a8}@media(max-width:700px){main{padding:24px 14px}.wrap{max-height:calc(100vh - 290px)}}
  </style>
</head>
<body><main>
  <header><div class="eyebrow">RLC 2026 · Montréal</div><h1>Conference tracker</h1><p id="subtitle"></p></header>
  <nav class="tabs" id="tabs"></nav><div class="notice">Times shown in Montréal local time (EDT). Scroll sideways to compare every room.</div>
  <div class="wrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>
</main>
<script>
const official='https://rl-conference.cc/schedule.html';
const paper=(d,t,time)=>`https://rl-conference.cc/paper_schedule.html?session=${encodeURIComponent(`${d}|${t}|${time}`)}`;
const sites={'George Konidaris':'https://cs.brown.edu/people/gdk/','Katia Sycara':'https://www.ri.cmu.edu/ri-faculty/katia-sycara/','Sarath Chandar':'https://sarathchandar.in/','David Abel':'https://david-abel.github.io/','Peter Stone':'https://www.cs.utexas.edu/~pstone/','Richard S. Sutton':'http://incompleteideas.net/','A. Rupam Mahmood':'https://armahmood.github.io/','Harry Zhao':'https://pwnerharry.github.io/','Scott Fujimoto':'https://scholar.google.com/','Danijar Hafner':'https://danijar.com/','Doina Precup':'https://doinaprecup.github.io/','Cyrus Neary':'https://cyrusneary.com/','Kevin Murphy':'https://www.cs.ubc.ca/~murphyk/','Sorina Lupu':'https://scholar.google.com/','Mohamed Elsayed':'https://scholar.google.com/','Martha White':'https://webdocs.cs.ualberta.ca/~whitem/','John Carmack':'https://en.wikipedia.org/wiki/John_Carmack','Özgür Şimşek':'https://scholar.google.com/','Serena Booth':'https://serenabooth.com/','Sara Aronowitz':'https://www.saraaronowitz.com/','Joel Lehman':'https://www.joellehman.com/','Dylan Brenneis':'https://dylanbrenneis.ca/','Clare Lyle':'https://clarelyle.com/','Junhyuk Oh':'https://junhyuk.com/','Théo Vincent':'https://www.ias.informatik.tu-darmstadt.de/Team/TheoVincent','Antonin Raffin':'https://araffin.github.io/','Marc Bellemare':'https://www.marcgbellemare.info/','Sheila McIlraith':'https://www.cs.toronto.edu/~sheila/','Rika Antonova':'https://rikaantonova.com/','Balaraman Ravindran':'https://ravindran.org/'};
const linkNames=text=>Object.entries(sites).reduce((out,[name,url])=>out.replaceAll(name,`${name}<span class="site-line"><a class="speaker-site" href="${url}" target="_blank" rel="noreferrer">Website ↗</a></span>`),text);
const workshops=[['Continual RL','B-2305','https://sites.google.com/view/continual-learning/schedule'],['World Models','B-4335','https://worldmodels-rlc.github.io/'],['RL + Games','B-4345','https://sites.google.com/view/rlvg-2026/schedule'],['Big Worlds','B-4325','https://rlinbigworlds.ca/'],['Beyond Rewards','B-2325','https://rlbrew-workshop.github.io/'],['Finding the Frame','B-0305','https://sites.google.com/view/findingtheframe/schedule'],['AutoRL','B-4315','https://sites.google.com/view/automatedrl/schedule']];
const tracks=[['Main stage','B-2285',official],['Track A','B-2305',official],['Track B','B-0325',official],['Track C','B-2325',official],['Track D','B-0305',official]];
const days={
 saturday:{label:'Saturday, August 15 · Workshop day',cols:workshops,rows:[['9:00',['Opening + George Konidaris','Harry Zhao','Program to be announced','Doina Precup','Program to be announced','Özgür Şimşek · Serena Booth','Martha White · Clare Lyle']],['10:30',['1. The Three Regimes of Offline-to-Online Reinforcement Learning — Lu Li, Tianwei Ni, Yihao Sun, Pierre-Luc Bacon<br><br>2. Task diversity produces systematic transfer but inhibits continual reinforcement learning — Purab Seth, Neil Shah, Kunal Jha, Samuel J. Gershman, Max Kleiman-Weiner, Wilka Carvalho<br><br>3. Flow-Corrected Thompson Sampling for Non-Stationary Contextual Bandits — AmirHossein Naghdi, Ali Baheri<br><br>4. Calibrated Partial Resets: Preventing Policy Collapse in Continual Reinforcement Learning — Luc McCutcheon, Evangelos Chatzaroulas, Saber Fallah','Danijar Hafner','','Sorina Lupu','','Invited-speaker panel','Théo Vincent']],['12:00',Array(7).fill('Lunch break')],['1:30',['Peter Stone','Doina Precup','','Mohamed Elsayed','','Poster session 1','Junhyuk Oh']],['2:30',['5. Forgetting is Everywhere — Ben Sanati, Thomas L Lee, Trevor McInroe, Aidan Scannell, Nikolay Malkin, David Abel, Amos Storkey<br><br>6. Security-Gym: Evaluating Temporally-Uniform Agents on High-Fidelity Linux Telemetry — Keith Lawson, Hafiz Malik','Poster session','','Aryaman Reddi','','Contributed oral presentations','Debate']],['3:30',['Posters + coffee','Cyrus Neary','','Panel · John Carmack et al.','','Dylan Brenneis','Oral presentations']],['4:00',['7. Connectivity, Credit Assignment, and the Speed of Learning — Edan Meyer, Andrew Freeman, Richard S. Sutton<br><br>8. QD-Learning for Continual Reinforcement Learning — Zijing Wu, Doina Precup, Paul Masset, Nishanth Anand','Closing remarks','','Closing remarks','','Poster session 2','Antonin Raffin']]]},
 sunday:{label:'Sunday, August 16',cols:tracks,rows:[['9:15',['Opening comments','','','','']],['9:30',['Keynote · Marc Bellemare','','','','']],['11:00',['','Theory of RL','Task specification + rewards','Core RL algorithms','Evaluation + benchmarks']],['12:00',['Lunch · B-2294','','','','']],['1:00',['Poster session · 31 posters','','','','']],['4:00',['Cirque du Soleil','','','','']],['6:00',['Reception','','','','']]]},
 monday:{label:'Monday, August 17',cols:tracks,rows:[['9:00',['Keynote · Sheila McIlraith','','','','']],['10:20',['','Bandits','Fairness + HAI · Hierarchical RL','Core RL algorithms','Applied RL']],['11:40',['','Understanding deep RL','Task specification + rewards','Planning + model-based RL','Multi-agent RL']],['12:30',['WiML lunch','','','','']],['2:00',['Keynote · Danijar Hafner','','','','']],['3:00',['Poster session · 60 posters','','','','']]]},
 tuesday:{label:'Tuesday, August 18',cols:tracks,rows:[['9:00',['Keynote · Rika Antonova','','','','']],['10:20',['','Theory of RL','Safe, robust + risk-sensitive RL','Offline RL','Evaluation + benchmarks']],['11:40',['','Understanding deep RL','RL fine-tuning · Imitation learning','Continual + Streaming RL · Exploration','Multi-agent RL']],['12:30',['Lunch · B-2294','','','','']],['1:00',['Town hall · Salle Claude-Champagne','','','','']],['2:00',['Keynote · Balaraman Ravindran','','','','']],['3:00',['Poster session · 60 posters','','','','']]]}
};
const nav=[['saturday','Sat 15','Workshops'],['sunday','Sun 16','Conference'],['monday','Mon 17','Conference'],['tuesday','Tue 18','Conference']];
function render(){const key=(location.hash||'#saturday').slice(1),day=days[key]||days.saturday;document.querySelector('#subtitle').textContent=day.label+' · Université de Montréal';document.querySelector('#tabs').innerHTML=nav.map(n=>`<a href="#${n[0]}" class="${n[0]===key?'active':''}"><b>${n[1]}</b><span>${n[2]}</span></a>`).join('');document.querySelector('#head').innerHTML='<th class="time">TIME</th>'+day.cols.map((c,i)=>`<th style="--accent:${['#243b32','#f0544f','#5b5bd6','#0f9d79','#e89826','#ad5bd6','#147db3'][i]}">${c[0]}<span class="room">Room ${c[1]}</span></th>`).join('');document.querySelector('#body').innerHTML=day.rows.map(r=>`<tr><th class="time">${r[0]}</th>${r[1].map((x,i)=>{if(!x)return'<td></td>';let url=day.cols[i][2],cls=/Lunch|coffee/i.test(x)?'break':/Poster/i.test(x)?'poster':'';if(key!=='saturday'&&i>0&&(r[0]==='10:20'||r[0]==='11:40'||r[0]==='11:00'))url=paper('Aug '+({sunday:16,monday:17,tuesday:18}[key]),i,r[0]+' AM');return`<td><div class="card ${cls}"><a class="source-arrow" href="${url}" target="_blank" rel="noreferrer" aria-label="Open original schedule">↗</a><b>${linkNames(x)}</b></div></td>`}).join('')}</tr>`).join('')}
addEventListener('hashchange',render);render();
</script></body></html>
